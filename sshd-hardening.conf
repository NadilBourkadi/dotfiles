# Copied (not symlinked) to /etc/ssh/sshd_config.d/01-dotfiles.conf by
# init.zsh, and only once ~/.ssh/authorized_keys has a key in it. The 01-
# prefix matters: sshd keeps the FIRST value it reads, so a later-sorting
# drop-in (e.g. cloud-init's 50-cloud-init.conf) cannot switch passwords
# back on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
