# Alacritty config for macOS and native Linux.
#
# Colours live in alacritty/theme.toml so the Windows build can share them —
# see bin/alacritty-windows-sync.
#
# The import goes through the symlink init.zsh creates, not a literal repo
# path, so the repo can be cloned anywhere — init.zsh derives DOTFILES_DIR
# from $0 for the same reason. The cost is that pulling this change for the
# first time needs one `init.zsh` run to create that symlink; until then
# Alacritty falls back to its default palette.
#
# `[general] import` requires Alacritty 0.14+; `~` is expanded.

[general]
import = ["~/.config/alacritty/theme.toml"]

[font]
size = 15.5

[font.normal]
family = "Hack Nerd Font"

[window]
# Buttonless is macOS-only; the Windows config overrides it.
decorations = "Buttonless"
startup_mode = "Maximized"
opacity = 0.95
dynamic_padding = false

[window.padding]
x = 0
y = 0
